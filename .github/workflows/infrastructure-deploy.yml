name: infrastructure-deploy
on:
  push:
    branches: [main]
    paths: ['terraform/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # needed so `terraform output -raw` works in scripts

      - name: Deploy infrastructure and controller
        run: ./scripts/deploy-infrastructure.sh
        
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -input=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - run: terraform apply -auto-approve -input=false
        working-directory: terraform
      - name: Install Load Balancer Controller
        run: ./scripts/install-lb-controller.sh   # or the Phase B part of the script